databases:
  - name: legal-consultation-db
    plan: free
    databaseName: legal_consultation
    user: legal_admin

services:
  - type: web
    name: legal-consultation-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build && npx prisma migrate deploy && npx tsx prisma/seed.ts
    startCommand: cd backend && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: legal-consultation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: legal-consultation-frontend
          property: host
    healthCheckPath: /api/v1/health

  - type: web
    name: legal-consultation-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: legal-consultation-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
